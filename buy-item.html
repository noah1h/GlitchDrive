<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="GlitchDrive - Your trusted destination for buying and selling quality cars.">
  <title>GlitchDrive</title>

  <!-- Favicon -->
  <link rel="icon" href="imgs/favicon.png"/>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Barlow:wght@400;700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />

  <!-- AOS.js -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />

  <!-- Swiper.js -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  

  <main id="buy-page">
    <div class="login-container">
      <div class="login-card" data-aos="fade-up" data-aos-duration="800">
        <div class="buy-title">Complete Your Purchase</div>
        
        <div class="container">
          <form>
            <!-- Car Summary -->
            <div class="form-section">
              <h5 class="car-summary-title">Vehicle Summary</h5>
              <div class="details-card" data-aos="fade-right" data-aos-delay="200">
                <div class="car-details">
                  <div class="car-detail-item">
                    <span class="car-detail-label">Model</span>
                    <span class="car-detail-value">Porsche 911 Carrera</span>
                  </div>
                  <div class="car-detail-item">
                    <span class="car-detail-label">Color</span>
                    <span class="car-detail-value">Midnight Black</span>
                  </div>
                  <div class="car-detail-item">
                    <span class="car-detail-label">Total Price</span>
                    <span class="car-detail-value">$98,000</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- Buyer Information -->
            <div class="form-section" data-aos="fade-left" data-aos-delay="300">
              <h6 class="section-title">Buyer Information</h6>
              
              <div class="mb-3">
                <label for="fullName" class="form-label">Full Name</label>
                <input
                  type="text"
                  class="form-control"
                  id="fullName"
                  placeholder="Enter your full legal name"
                  required
                >
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  placeholder="your.email@example.com"
                  required
                >
              </div>

              <div class="mb-3">
                <label for="address" class="form-label">Delivery Address</label>
                <input
                  type="text"
                  class="form-control"
                  id="address"
                  placeholder="123 Main Street, City, State, ZIP"
                  required
                >
              </div>
            </div>

            <!-- Payment Information -->
            <div class="form-section" data-aos="fade-right" data-aos-delay="400">
              <h6 class="section-title">Payment Details</h6>
              
              <div class="payment-grid">
                <div class="mb-3">
                  <label for="card" class="form-label">Credit Card Number</label>
                  <input
                    type="text"
                    class="form-control"
                    id="card"
                    placeholder="1234 5678 9012 3456"
                    maxlength="19"
                    required
                  >
                </div>
                
                <div class="mb-3">
                  <label for="cvv" class="form-label">CVV</label>
                  <input
                    type="text"
                    class="form-control"
                    id="cvv"
                    placeholder="123"
                    maxlength="4"
                    required
                  >
                </div>
              </div>

              <div class="payment-grid">
                <div class="mb-3">
                  <label for="expiry" class="form-label">Expiry Date</label>
                  <input
                    type="text"
                    class="form-control"
                    id="expiry"
                    placeholder="MM/YY"
                    maxlength="5"
                    required
                  >
                </div>
                
                <div class="mb-3">
                  <label for="cardholder" class="form-label">Cardholder Name</label>
                  <input
                    type="text"
                    class="form-control"
                    id="cardholder"
                    placeholder="Name on card"
                    required
                  >
                </div>
              </div>

              <div class="security-badge">
                <span>🔒</span>
                <span>Your payment information is secured with 256-bit SSL encryption</span>
              </div>
            </div>

            <div class="d-grid" data-aos="fade-up" data-aos-delay="500">
              <button type="submit" class="confirm-button pulse">
                <span>Confirm Purchase - $98,000</span>
              </button>
            </div>
          </form>

          <p class="mt-4 text-center">
            <a href="inventory.html" class="back-link">
              <span>←</span>
              <span>Return to inventory</span>
            </a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <!-- jQuery (single import) -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
 
  <!-- AOS -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init();
  </script>

  <!-- Custom JS -->
  <script>
  
  </script>
  <script src="js/script.js"></script>
</body>
</html>
